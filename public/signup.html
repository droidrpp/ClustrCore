<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – ClustrCore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap');

    /* ── VARIABLES ─────────────────────────────────────── */
    :root {
      --bg-primary: #f4f1ec;
      --bg-secondary: #eae6df;
      --bg-card: #ffffff;
      --text-primary: #1a1714;
      --text-secondary: #5c5650;
      --text-muted: #9c958d;
      --accent-1: #c8623a;
      --accent-2: #3a6bc8;
      --accent-gradient: linear-gradient(135deg, #c8623a 0%, #e08c4a 50%, #3a6bc8 100%);
      --accent-glow: rgba(200, 98, 58, 0.2);
      --border: rgba(26, 23, 20, 0.1);
      --border-strong: rgba(26, 23, 20, 0.22);
      --shadow-sm: 0 2px 8px rgba(26,23,20,0.08);
      --shadow-md: 0 8px 32px rgba(26,23,20,0.12);
      --shadow-lg: 0 24px 64px rgba(26,23,20,0.16);
      --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
      --radius-sm: 10px;
    }

    [data-theme="dark"] {
      --bg-primary: #0f0e0d;
      --bg-secondary: #161412;
      --bg-card: #1c1916;
      --text-primary: #f0ece6;
      --text-secondary: #a09890;
      --text-muted: #6b6358;
      --accent-1: #e07a50;
      --accent-2: #6a9be8;
      --accent-gradient: linear-gradient(135deg, #e07a50 0%, #e8a060 50%, #6a9be8 100%);
      --accent-glow: rgba(224,122,80,0.18);
      --border: rgba(240,236,230,0.08);
      --border-strong: rgba(240,236,230,0.16);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
      --shadow-md: 0 8px 32px rgba(0,0,0,0.45);
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.6);
    }

    /* ── RESET ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
      color: var(--text-primary);
    }

    /* Animated grid */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 56px 56px;
      opacity: 0.5;
      pointer-events: none;
      animation: gridDrift 25s linear infinite;
    }
    @keyframes gridDrift {
      from { background-position: 0 0; }
      to   { background-position: 56px 56px; }
    }

    /* Noise */
    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    /* Ambient orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.3;
      animation: orbFloat 10s ease-in-out infinite;
    }
    .orb-1 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(200,98,58,0.4), transparent 70%);
      top: -100px; right: -80px;
    }
    .orb-2 {
      width: 340px; height: 340px;
      background: radial-gradient(circle, rgba(58,107,200,0.35), transparent 70%);
      bottom: -80px; left: -60px;
      animation-delay: -5s;
      animation-direction: reverse;
    }
    @keyframes orbFloat {
      0%,100% { transform: scale(1) translate(0,0); }
      33%     { transform: scale(1.08) translate(10px,-14px); }
      66%     { transform: scale(0.94) translate(-8px,10px); }
    }

    /* ── THEME BUTTON ───────────────────────────────────── */
    .theme-btn {
      position: fixed;
      top: 1.25rem; right: 1.25rem;
      z-index: 100;
      width: 40px; height: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem;
      color: var(--text-primary);
      transition: all var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .theme-btn:hover {
      background: var(--bg-secondary);
      border-color: var(--border-strong);
      transform: scale(1.08) rotate(15deg);
    }

    /* ── CARD ───────────────────────────────────────────── */
    .signup-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      width: 100%;
      max-width: 480px;
      padding: 2.75rem 2.5rem;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 2;
      animation: cardIn 0.7s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Gradient top border */
    .signup-container::before {
      content: '';
      position: absolute;
      top: 0; left: 2rem; right: 2rem;
      height: 2px;
      background: var(--accent-gradient);
      border-radius: 0 0 4px 4px;
    }

    /* ── BACK LINK ──────────────────────────────────────── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-decoration: none;
      margin-bottom: 1.5rem;
      transition: color var(--transition);
    }
    .back-link:hover { color: var(--accent-1); }

    /* ── LOGO ───────────────────────────────────────────── */
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 15px;
      margin-bottom: 0.875rem;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      box-shadow: var(--shadow-sm);
      position: relative;
    }
    .logo-mark::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 18px;
      border: 1px solid var(--border);
    }
    .logo h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.25rem;
    }
    .logo p {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 300;
    }

    /* ── FORM ───────────────────────────────────────────── */
    .form-group { margin-bottom: 1rem; }

    .form-group label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .input-wrapper { position: relative; }

    .input-wrapper i.input-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.82rem;
      pointer-events: none;
      transition: color var(--transition);
    }
    .input-wrapper:focus-within i.input-icon { color: var(--accent-1); }

    input, select {
      width: 100%;
      padding: 0.72rem 1rem 0.72rem 2.5rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.88rem;
      color: var(--text-primary);
      outline: none;
      transition: all var(--transition);
      appearance: none;
    }
    input::placeholder { color: var(--text-muted); }
    input:focus, select:focus {
      border-color: var(--accent-1);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Password toggle */
    .toggle-pw {
      position: absolute;
      right: 11px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.82rem;
      padding: 4px;
      transition: color var(--transition);
    }
    .toggle-pw:hover { color: var(--accent-1); }

    /* Select arrow */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '\f078';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 13px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-muted);
      font-size: 0.7rem;
    }
    .select-wrap select { padding-right: 2.5rem; }

    /* ── PASSWORD STRENGTH ──────────────────────────────── */
    .strength-wrap {
      margin-top: 0.5rem;
      display: none;
    }
    .strength-wrap.show { display: block; }

    .strength-track {
      height: 3px;
      background: var(--bg-secondary);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 0.3rem;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      transition: width 0.4s ease, background 0.4s ease;
    }
    .strength-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .s-weak   { background: #ef4444; }
    .s-medium { background: #f59e0b; }
    .s-strong { background: #3a9c5a; }

    /* ── ROLE CARDS ─────────────────────────────────────── */
    .role-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.4rem;
    }
    .role-card {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--bg-secondary);
      position: relative;
      overflow: hidden;
    }
    .role-card::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent-gradient);
      transform: scaleX(0);
      transition: transform var(--transition);
    }
    .role-card:hover { border-color: var(--border-strong); background: var(--bg-card); }
    .role-card.selected {
      border-color: var(--accent-1);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .role-card.selected::before { transform: scaleX(1); }
    .role-card i {
      display: block;
      font-size: 1.1rem;
      margin-bottom: 0.3rem;
      color: var(--text-muted);
      transition: color var(--transition);
    }
    .role-card.selected i { color: var(--accent-1); }
    .role-card span {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .role-card.selected span { color: var(--text-primary); }
    #role { display: none; }

    /* ── ERROR / SUCCESS MSG ────────────────────────────── */
    .msg-banner {
      border-radius: 8px;
      padding: 0.6rem 0.875rem;
      font-size: 0.82rem;
      display: none;
      margin-bottom: 1rem;
      align-items: center;
      gap: 0.5rem;
    }
    .msg-banner.show { display: flex; }
    .msg-banner.error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444;
    }
    .msg-banner.success {
      background: rgba(58,156,90,0.1);
      border: 1px solid rgba(58,156,90,0.3);
      color: #3a9c5a;
    }

    /* ── SUBMIT BUTTON ──────────────────────────────────── */
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      margin-top: 1.25rem;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 4px 16px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }
    .btn-submit:active:not(:disabled) { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── DIVIDER ────────────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.875rem;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border);
    }

    /* ── FOOTER ─────────────────────────────────────────── */
    .signin-link {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }
    .signin-link a {
      color: var(--accent-1);
      text-decoration: none;
      font-weight: 600;
      transition: color var(--transition);
    }
    .signin-link a:hover { color: var(--accent-2); }

    /* ── SUCCESS OVERLAY ────────────────────────────────── */
    .success-overlay {
      position: absolute; inset: 0;
      background: var(--bg-card);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.875rem;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition);
    }
    .success-overlay.show { opacity: 1; pointer-events: all; }
    .success-icon {
      width: 60px; height: 60px;
      background: rgba(58,156,90,0.12);
      border: 1px solid rgba(58,156,90,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: #3a9c5a;
      animation: successPop 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes successPop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .success-overlay h3 {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem; font-weight: 700;
      color: var(--text-primary);
    }
    .success-overlay p { font-size: 0.85rem; color: var(--text-muted); }


    /* ── TEAM EXPAND SECTION ────────────────────────────── */
    .team-expand {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease;
    }
    .team-expand.open {
      max-height: 600px;
      opacity: 1;
    }

    .team-divider {
      display: flex; align-items: center; gap: .75rem;
      margin: 0.25rem 0 1.125rem;
    }
    .team-divider-line { flex:1; height:1px; background:var(--border); }
    .team-divider-badge {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: rgba(200,98,58,0.08);
      border: 1px solid rgba(200,98,58,0.22);
      color: var(--accent-1);
      padding: .22rem .7rem; border-radius: 100px;
      white-space: nowrap;
    }

    .team-grid {
      display: grid; grid-template-columns: repeat(3,1fr); gap: .5rem;
      margin-top: .4rem;
    }

    /* Team-specific icon colors */
    .team-opt[data-team="tech"]    i { color: #3a6bc8 !important; }
    .team-opt[data-team="events"]  i { color: #c8623a !important; }
    .team-opt[data-team="digital"] i { color: #8b5cf6 !important; }

    .team-opt.selected[data-team="tech"]    { border-color: #3a6bc8; box-shadow: 0 0 0 3px rgba(58,107,200,0.15); }
    .team-opt.selected[data-team="events"]  { border-color: #c8623a; box-shadow: 0 0 0 3px rgba(200,98,58,0.15); }
    .team-opt.selected[data-team="digital"] { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }

    /* Highlight team card when selected — override generic */
    .team-opt.selected i { opacity: 1 !important; }

    /* ── PHOTO UPLOAD ───────────────────────────────────── */
    #photoGroup { display: none; }
    #photoGroup.show { display: block; }

    .photo-upload-wrapper {
      margin-bottom: 0.5rem;
    }

    .photo-preview {
      width: 100%;
      height: 140px;
      background: var(--bg-secondary);
      border: 2px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .photo-preview:hover {
      border-color: var(--accent-1);
      background: var(--bg-card);
    }

    .photo-preview i {
      font-size: 2rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
            transition: color var(--transition);
    }

    .photo-preview span {
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: color var(--transition);
    }

    .photo-preview:hover i,
    .photo-preview:hover span {
      color: var(--accent-1);
    }

    .photo-preview.has-image {
      border-color: transparent;
      background: transparent;
      overflow: hidden;
    }

    .photo-preview.has-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-preview.has-image i,
    .photo-preview.has-image span {
      display: none;
    }

    .photo-info {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    #socialGroup {
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; max-height: 0; overflow: hidden; }
      to { opacity: 1; max-height: 600px; }
    }

    /* ── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 480px) {
      .signup-container { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Theme toggle -->
  <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">
    <i class="fas fa-moon"></i>
  </button>

  <div class="signup-container">

    <!-- Success overlay -->
    <div class="success-overlay" id="successOverlay">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h3>Account Created!</h3>
      <p>Redirecting you to login…</p>
    </div>

    <!-- Back link -->
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to home
    </a>

    <!-- Logo -->
    <div class="logo">
      <div class="logo-mark">CC</div>
      <h1>ClustrCore</h1>
      <p>Create your account to get started</p>
    </div>

    <!-- Banner -->
    <div class="msg-banner error" id="msgBanner">
      <i class="fas fa-circle-exclamation"></i>
      <span id="msgText">Please fill all fields.</span>
    </div>

    <form id="signupForm" autocomplete="off">

      <div class="form-group">
        <label>Full Name</label>
        <div class="input-wrapper">
          <i class="fas fa-user input-icon"></i>
          <input id="name" type="text" placeholder="Your full name" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope input-icon"></i>
          <input id="email" type="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <i class="fas fa-lock input-icon"></i>
          <input id="password" type="password" placeholder="Create a strong password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">
            <i class="fas fa-eye" id="pwIcon"></i>
          </button>
        </div>
        <!-- Strength meter -->
        <div class="strength-wrap" id="strengthWrap">
          <div class="strength-track">
            <div class="strength-bar" id="strengthBar"></div>
          </div>
          <span class="strength-label" id="strengthLabel" style="color:var(--text-muted)">—</span>
        </div>
      </div>

      <div class="form-group">
        <label>Your Role</label>
        <select id="role" name="role"></select>
        <div class="role-grid" id="roleGrid">
          <div class="role-card" data-role="student">
            <i class="fas fa-graduation-cap"></i>
            <span>Student</span>
          </div>
          <div class="role-card" data-role="team">
            <i class="fas fa-users"></i>
            <span>Team</span>
          </div>
          <div class="role-card" data-role="admin">
            <i class="fas fa-shield-halved"></i>
            <span>Admin</span>
          </div>
        </div>
      </div>

      <!-- TEAM EXTRA FIELDS -->
      <div id="teamFields" class="team-expand">

        <div class="team-divider">
          <span class="team-divider-line"></span>
          <span class="team-divider-badge"><i class="fas fa-users"></i> Team Details</span>
          <span class="team-divider-line"></span>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <div class="input-wrapper">
            <i class="fas fa-phone input-icon"></i>
            <input id="phone" type="tel" placeholder="+91 98765 43210">
          </div>
        </div>

        <div class="form-group">
          <label>Your Team</label>
          <div class="team-grid" id="teamGrid">
            <div class="role-card team-opt" data-team="tech">
              <i class="fas fa-code"></i>
              <span>Technical</span>
            </div>
            <div class="role-card team-opt" data-team="events">
              <i class="fas fa-calendar-star"></i>
              <span>Events</span>
            </div>
            <div class="role-card team-opt" data-team="digital">
              <i class="fas fa-palette"></i>
              <span>Digital</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>Your Role in Team</label>
          <div class="input-wrapper select-wrap">
            <i class="fas fa-id-badge input-icon"></i>
            <select id="teamRole">
              <option value="">— select your team first —</option>
            </select>
          </div>
        </div>

        <!-- PHOTO UPLOAD (Team/Admin) -->
        <div class="form-group" id="photoGroup">
          <label>Your Photo</label>
          <div class="photo-upload-wrapper">
            <div class="photo-preview" id="photoPreview">
              <i class="fas fa-camera"></i>
              <span>Click to upload</span>
            </div>
            <input id="photoInput" type="file" accept="image/*" style="display:none;">
          </div>
          <div class="photo-info">Max 5MB, JPG/PNG recommended</div>
        </div>

        <!-- SOCIAL MEDIA LINKS (Team Only) -->
        <div id="socialGroup" style="display:none;">
          <div class="team-divider" style="margin-top:1.125rem;margin-bottom:1.125rem;">
            <span class="team-divider-line"></span>
            <span class="team-divider-badge"><i class="fas fa-share-alt"></i> Social Links (Optional)</span>
            <span class="team-divider-line"></span>
          </div>

          <div class="form-group">
            <label>LinkedIn Profile</label>
            <div class="input-wrapper">
              <i class="fab fa-linkedin input-icon"></i>
              <input id="linkedin" type="text" placeholder="linkedin.com/in/yourprofile">
            </div>
          </div>

          <div class="form-group">
            <label>GitHub Profile</label>
            <div class="input-wrapper">
              <i class="fab fa-github input-icon"></i>
              <input id="github" type="text" placeholder="github.com/yourprofile">
            </div>
          </div>
        </div>

      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Create Account <i class="fas fa-arrow-right"></i></span>
      </button>

    </form>

    <div class="divider"><span>or</span></div>

    <div class="signin-link">
      Already have an account? <a href="login.html">Sign In</a>
    </div>

  </div>

  <script>
  (() => {
    /* ── THEME ──────────────────────────────────────────── */
    const html  = document.documentElement;
    const tBtn  = document.getElementById('themeToggle');
    const saved = localStorage.getItem('clustr-theme') || 'light';
    applyTheme(saved);

    function applyTheme(t) {
      html.setAttribute('data-theme', t);
      localStorage.setItem('clustr-theme', t);
      tBtn.querySelector('i').className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    }

    tBtn.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      tBtn.style.transform = 'scale(0.8) rotate(25deg)';
      setTimeout(() => { tBtn.style.transform = ''; applyTheme(next); }, 140);
    });

    /* ── PASSWORD TOGGLE ────────────────────────────────── */
    const pwInput = document.getElementById('password');
    const pwIcon  = document.getElementById('pwIcon');
    document.getElementById('togglePw').addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      pwIcon.className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
    });

    /* ── PASSWORD STRENGTH ──────────────────────────────── */
    const strengthWrap  = document.getElementById('strengthWrap');
    const strengthBar   = document.getElementById('strengthBar');
    const strengthLabel = document.getElementById('strengthLabel');

    pwInput.addEventListener('input', () => {
      const val = pwInput.value;
      if (!val) {
        strengthWrap.classList.remove('show');
        return;
      }
      strengthWrap.classList.add('show');

      let score = 0;
      if (val.length >= 8)                              score++;
      if (/[a-z]/.test(val) && /[A-Z]/.test(val))      score++;
      if (/[0-9]/.test(val))                            score++;
      if (/[^a-zA-Z0-9]/.test(val))                    score++;

      const levels = [
        { pct: '25%',  cls: 's-weak',   label: 'Weak',   color: '#ef4444' },
        { pct: '50%',  cls: 's-weak',   label: 'Weak',   color: '#ef4444' },
        { pct: '66%',  cls: 's-medium', label: 'Medium', color: '#f59e0b' },
        { pct: '100%', cls: 's-strong', label: 'Strong', color: '#3a9c5a' },
      ];
      const lvl = levels[Math.min(score, 3)];
      strengthBar.style.width      = lvl.pct;
      strengthBar.style.background = lvl.color;
      strengthLabel.textContent    = lvl.label;
      strengthLabel.style.color    = lvl.color;
    });

    /* ── ROLE CARDS ─────────────────────────────────────── */
    const roleSelect = document.getElementById('role');
    let selectedRole     = '';
    let selectedTeam     = '';
    let selectedTeamRole = '';

    const TEAM_ROLES = {
      tech:    ['Lead Developer', 'Backend Developer', 'Frontend Developer', 'DevOps Engineer'],
      events:  ['Event Lead', 'Coordinator', 'Logistics Head', 'Outreach Lead'],
      digital: ['Design Lead', 'Social Media Manager', 'Content Creator'],
    };

    document.getElementById('roleGrid').addEventListener('click', e => {
      const card = e.target.closest('.role-card');
      if (!card || card.closest('#teamGrid')) return;
      document.querySelectorAll('#roleGrid .role-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedRole = card.dataset.role;

      const tf         = document.getElementById('teamFields');
      const teamGroup  = document.getElementById('teamGrid')?.closest('.form-group');
      const roleGroup  = document.getElementById('teamRole')?.closest('.form-group');

      if (selectedRole === 'team' || selectedRole === 'admin') {
        tf.classList.add('open');
        // Admin only needs phone — hide team picker & role dropdown
        if (selectedRole === 'admin') {
          if (teamGroup) teamGroup.style.display = 'none';
          if (roleGroup) roleGroup.style.display = 'none';
        } else {
          if (teamGroup) teamGroup.style.display = '';
          if (roleGroup) roleGroup.style.display = '';
        }
      } else {
        tf.classList.remove('open');
        selectedTeam = ''; selectedTeamRole = '';
      }
    });

    // Team grid selection
    document.getElementById('teamGrid').addEventListener('click', e => {
      const card = e.target.closest('.team-opt');
      if (!card) return;
      document.querySelectorAll('.team-opt').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      selectedTeam = card.dataset.team;

      // Populate role dropdown based on selected team
      const sel = document.getElementById('teamRole');
      const roles = TEAM_ROLES[selectedTeam] || [];
      sel.innerHTML = '<option value="">— pick your role —</option>' +
        roles.map(r => `<option value="${r}">${r}</option>`).join('');
      selectedTeamRole = '';
    });

    document.getElementById('teamRole').addEventListener('change', e => {
      selectedTeamRole = e.target.value;
    });

    /* ── BANNER ─────────────────────────────────────────── */
    function showBanner(msg, type = 'error') {
      const banner = document.getElementById('msgBanner');
      document.getElementById('msgText').textContent = msg;
      banner.className = `msg-banner ${type} show`;
      setTimeout(() => banner.classList.remove('show'), 4500);
    }

    /* ── LOADING ────────────────────────────────────────── */
    const submitBtn = document.getElementById('submitBtn');
    const spinner   = document.getElementById('spinner');
    const btnText   = document.getElementById('btnText');

    function setLoading(on) {
      submitBtn.disabled     = on;
      spinner.style.display  = on ? 'block' : 'none';
      btnText.style.display  = on ? 'none'  : 'flex';
    }

    /* ── FORM SUBMIT ────────────────────────────────────── */
    document.getElementById('signupForm').addEventListener('submit', async e => {
      e.preventDefault();

      const name     = document.getElementById('name').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = pwInput.value;

      if (!name || !email || !password) { showBanner('Please fill in all fields.'); return; }
      if (!selectedRole)                { showBanner('Please select your role.');   return; }
      if (password.length < 6)          { showBanner('Password must be at least 6 characters.'); return; }

      // Role-specific validation
      const phone = document.getElementById('phone').value.trim();
      if (selectedRole === 'team' || selectedRole === 'admin') {
        if (!phone) { showBanner('Please enter your phone number.'); return; }
      }
      if (selectedRole === 'team') {
        if (!selectedTeam)     { showBanner('Please select your team.'); return; }
        if (!selectedTeamRole) { showBanner('Please select your role within the team.'); return; }
      }

      setLoading(true);

      try {
        const res = await fetch('http://localhost:5000/api/auth/signup', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            name, email, password,
            role: selectedRole,
            ...((selectedRole === 'team' || selectedRole === 'admin') && { phone }),
            ...(selectedRole === 'team' && {
              team:     selectedTeam,
              teamRole: selectedTeamRole,
            }),
          }),
        });

        const data = await res.json();

        if (res.ok) {
          setLoading(false);
          document.getElementById('successOverlay').classList.add('show');
          // All roles go to login after signup
          setTimeout(() => { window.location.href = 'login.html'; }, 1500);
        } else {
          throw new Error(data.message || 'Sign up failed. Please try again.');
        }

      } catch (err) {
        showBanner(err.message || 'Server error. Try again later.');
      } finally {
        setLoading(false);
      }
    });

  })();
  </script>
</body>
</html>
